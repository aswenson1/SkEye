[project]
site_name = "SkEye Documentation"
site_description = "Design and development documentation for the SkEye tabletop spatial interface."
site_author = "SkEye Team"
site_url = "https://aswenson1.github.io/SkEye/"
repo_url = "https://github.com/aswenson1/SkEye"
repo_name = "aswenson1/SkEye"
edit_uri = "edit/main/docs/"
copyright = "SkEye · CEN4907C Design Project"

nav = [
  { "Home" = "index.md" },
  { "Get started" = "getting-started.md" },
  { "System" = [
    { "Overview" = "system/overview.md" },
  ] },
  { "Hardware" = [
    { "Overview" = "hardware/index.md" },
    { "Enclosure" = "hardware/enclosure.md" },
    { "Controller" = "hardware/controller.md" },
    { "Pin assignments" = "hardware/pinout.md" },
  ] },
  { "Software" = [
    { "Overview" = "software/index.md" },
  ] },
  { "Contributing" = [
    { "Documentation" = "contributing/documentation.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/telescope"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "IBM Plex Mono"
code = "IBM Plex Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Use light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "grey"
toggle.icon = "lucide/sun"
toggle.name = "Use dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "white"
toggle.icon = "lucide/moon"
toggle.name = "Follow system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/aswenson1/SkEye"
name = "SkEye on GitHub"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

